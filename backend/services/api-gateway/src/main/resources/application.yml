server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
        - id: user-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/users/**
        - id: customer-service
          uri: ${CUSTOMER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/customers/**
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/orders/**
        - id: warehouse-service
          uri: ${WAREHOUSE_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/warehouses/**
        - id: shipment-service
          uri: ${SHIPMENT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/shipments/**
        - id: tracking-service
          uri: ${TRACKING_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/tracking/**
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/notifications/**
management:
  endpoints:
    web:
      exposure:
        include: health,info
