[k8s_control_plane]
k8s-cp ansible_host=REPLACE_CONTROL_PLANE_PRIVATE_IP

[k8s_workers]
k8s-worker-1 ansible_host=REPLACE_WORKER_1_PRIVATE_IP
k8s-worker-2 ansible_host=REPLACE_WORKER_2_PRIVATE_IP

[k8s_cluster:children]
k8s_control_plane
k8s_workers

[k8s_cluster:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/logistics-keypair.pem
ansible_python_interpreter=/usr/bin/python3