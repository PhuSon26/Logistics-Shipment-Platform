- name: Install prerequisites, Java 21, Maven, Node.js, and Python
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - openjdk-21-jdk
      - maven
      - nodejs
      - npm
      - python3-pip
      - unzip
      - git
    state: present
    update_cache: yes

- name: Create apt keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Docker GPG key
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Add Docker apt repository
  apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present

- name: Install Docker CE and Compose plugin
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: yes

- name: Add ubuntu user to docker group
  user:
    name: ubuntu
    groups: docker
    append: yes

- name: Set vm.max_map_count for SonarQube
  sysctl:
    name: vm.max_map_count
    value: '524288'
    state: present
    reload: yes

- name: Install Trivy
  shell: |
    curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v{{ trivy_version }}
  args:
    creates: /usr/local/bin/trivy

- name: Install Gitleaks
  unarchive:
    src: "https://github.com/gitleaks/gitleaks/releases/download/v{{ gitleaks_version }}/gitleaks_{{ gitleaks_version }}_linux_x64.tar.gz"
    dest: /usr/local/bin
    remote_src: yes
    include:
      - gitleaks

- name: Create Jenkins and SonarQube directories
  file:
    path: "{{ item }}"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'
  loop:
    - "{{ jenkins_stack_dir }}"
    - "{{ jenkins_stack_dir }}/jenkins_data"
    - "{{ jenkins_stack_dir }}/sonarqube_data"
    - "{{ jenkins_stack_dir }}/sonarqube_extensions"

- name: Set ownership of jenkins_data to UID 1000
  file:
    path: "{{ jenkins_stack_dir }}/jenkins_data"
    owner: '1000'
    group: '1000'
    recurse: yes

- name: Render docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: "{{ jenkins_stack_dir }}/docker-compose.yml"
    owner: ubuntu
    group: ubuntu
    mode: '0644'
  notify: Restart Jenkins Stack

- name: Start Jenkins and SonarQube
  command: docker compose up -d
  args:
    chdir: "{{ jenkins_stack_dir }}"

- name: Wait for Jenkins initial admin password
  wait_for:
    path: "{{ jenkins_stack_dir }}/jenkins_data/secrets/initialAdminPassword"
    timeout: 120

- name: Read Jenkins initial admin password
  slurp:
    src: "{{ jenkins_stack_dir }}/jenkins_data/secrets/initialAdminPassword"
  register: jenkins_pwd

- name: Print Jenkins Initial Admin Password
  debug:
    msg: "Jenkins Initial Password: {{ jenkins_pwd.content | b64decode | trim }}"