# 1. Tắt Swap & cấu hình Kernel/Sysctl
- name: Disable swap
  ansible.builtin.shell: swapoff -a && sed -i '/\sswap\s/s/^/#/' /etc/fstab
  changed_when: false

- name: Copy kernel modules and sysctl templates
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: containerd.conf.j2, dest: /etc/modules-load.d/containerd.conf }
    - { src: kubernetes-cri.conf.j2, dest: /etc/sysctl.d/kubernetes-cri.conf }

- name: Load kernel modules and apply sysctl
  ansible.builtin.shell: modprobe overlay && modprobe br_netfilter && sysctl --system
  changed_when: false

# 2. Thêm GPG keys, APT repos & cài đặt containerd + Kubernetes
- name: Download Docker and Kubernetes GPG keys
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  loop:
    - { url: "https://download.docker.com/linux/ubuntu/gpg", dest: "/etc/apt/keyrings/docker.asc" }
    - { url: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_version }}/deb/Release.key", dest: "/etc/apt/keyrings/kubernetes.asc" }

- name: Add Docker and Kubernetes APT repositories
  ansible.builtin.apt_repository:
    repo: "{{ item.repo }}"
    filename: "{{ item.name }}"
    state: present
  loop:
    - { name: docker, repo: "deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable" }
    - { name: kubernetes, repo: "deb [signed-by=/etc/apt/keyrings/kubernetes.asc] https://pkgs.k8s.io/core:/stable:/{{ kubernetes_version }}/deb/ /" }

- name: Install containerd and Kubernetes packages
  ansible.builtin.apt:
    name: [containerd.io, kubelet, kubeadm, kubectl]
    state: present
    update_cache: true
    lock_timeout: 300
  notify:
    - Update containerd config to use systemd
    - Restart containerd

- name: Hold Kubernetes packages and enable kubelet
  ansible.builtin.shell: apt-mark hold kubelet kubeadm kubectl && systemctl enable kubelet
  changed_when: false

- name: Flush handlers before cluster init
  ansible.builtin.meta: flush_handlers

# 3. Khởi tạo Control Plane & cài Calico CNI
- name: Setup Control Plane and Calico CNI
  when: inventory_hostname in groups['k8s_control_plane']
  block:
    - name: Initialize Kubernetes Control Plane
      ansible.builtin.command: >
        kubeadm init
        --pod-network-cidr={{ pod_network_cidr }}
        --apiserver-advertise-address={{ ansible_default_ipv4.address }}
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Setup kubeconfig for ubuntu user
      ansible.builtin.shell: |
        mkdir -p /home/ubuntu/.kube
        cp -f /etc/kubernetes/admin.conf /home/ubuntu/.kube/config
        chown -R ubuntu:ubuntu /home/ubuntu/.kube
      changed_when: false

    - name: Download and apply Calico CNI
      ansible.builtin.shell: |
        curl -fsSL https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/calico.yaml -o /tmp/calico.yaml
        sed -i 's|# - name: CALICO_IPV4POOL_CIDR|- name: CALICO_IPV4POOL_CIDR|g; s|#   value: "192.168.0.0/16"|  value: "{{ pod_network_cidr }}"|g' /tmp/calico.yaml
        kubectl --kubeconfig=/etc/kubernetes/admin.conf apply -f /tmp/calico.yaml
      changed_when: false

    - name: Generate kubeadm join command
      ansible.builtin.command: kubeadm token create --print-join-command
      register: kubeadm_join_cmd
      changed_when: false

# 4. Join Worker Nodes vào Cluster
- name: Join worker nodes to cluster
  ansible.builtin.command: "{{ hostvars[groups['k8s_control_plane'][0]]['kubeadm_join_cmd']['stdout'] }}"
  args:
    creates: /etc/kubernetes/kubelet.conf
  when: inventory_hostname in groups['k8s_workers']